# Hermetic test environment for integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d
#        make test-integration-go
#        docker compose -f docker-compose.test.yml down

services:
  redis-test:
    image: redis:7-alpine
    ports:
      - "9202:6379"
    command: redis-server --save "" --appendonly no --requirepass testpass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testpass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  pubsub-test:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:568.0.0
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "9203:8085"
    environment:
      - PUBSUB_PROJECT_ID=test-project
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8085'"]
      interval: 2s
      timeout: 3s
      retries: 5

  postgres-test:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile.local
    image: leadership-sim-postgres-local:pg16
    ports:
      - "9213:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 5
