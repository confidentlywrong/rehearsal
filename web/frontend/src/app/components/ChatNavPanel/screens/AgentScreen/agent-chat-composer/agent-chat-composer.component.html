<div
  class="agent-chat-composer__input"
  [class.agent-chat-composer__input--loading]="isAgentWorking || isSecuringAgent"
>
  <textarea
    #chatTextArea
    class="agent-chat-composer__textarea"
    rows="1"
    aria-label="Message input"
    [placeholder]="placeholder"
    [ngModel]="text"
    (ngModelChange)="onInput($event)"
    [disabled]="isAgentWorking || isSecuringAgent"
    (keydown.enter)="onChatEnter($event)"
  ></textarea>
  <button
    class="agent-chat-composer__send"
    type="button"
    aria-label="Send message"
    (click)="send.emit()"
    [disabled]="!text.trim() || !canSend || isAgentWorking || isSecuringAgent"
  >
    <span class="material-icons" aria-hidden="true">send</span>
  </button>
</div>
